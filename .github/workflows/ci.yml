name: App checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Install pinned Flutter
        run: |
          nirvana_flutter_version="$(cat .flutter-version)"
          git clone --depth 1 --branch "$nirvana_flutter_version" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Prepare dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        working-directory: app
        run: dart format --page-width 100 --output=none --set-exit-if-changed lib test
      - name: Analyze and test
        working-directory: app
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Check notification resources
        run: python3 scripts/check_notification_resources.py
      - name: Build Android debug
        working-directory: app
        run: flutter build apk --debug --no-pub
      - name: Inspect packaged notification resources
        run: python3 scripts/check_notification_resources.py app/build/app/outputs/flutter-apk/app-debug.apk
